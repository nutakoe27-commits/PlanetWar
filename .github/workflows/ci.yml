name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Сборка и тесты на всех десктопных платформах.
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux gcc",     os: ubuntu-latest,  preset: linux-x64-debug,     cc: gcc,   cxx: g++ }
          - { name: "Linux clang",   os: ubuntu-latest,  preset: linux-x64-release,   cc: clang, cxx: clang++ }
          - { name: "Windows msvc",  os: windows-latest, preset: windows-x64-release, cc: "",    cxx: "" }
          - { name: "macOS arm64",   os: macos-latest,   preset: macos-arm64-release, cc: clang, cxx: clang++ }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Установить ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Настроить MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Конфигурация
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake --preset ${{ matrix.preset }}

      - name: Сборка
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Тесты
        run: ctest --preset ${{ matrix.preset }}

  # ---------------------------------------------------------------------------
  # Клиент на macOS.
  #
  # Отдельной работой, потому что клиенту нужны Vulkan и SDL, а основная
  # матрица собирает ядро и сервер без них. Без этой проверки разработчик
  # на маке узнавал бы о поломке клиента только когда сам сядет собирать —
  # а это единственная машина, на которой Vulkan идёт не нативно,
  # а поверх Metal через MoltenVK (ADR-013).
  # ---------------------------------------------------------------------------
  macos-client:
    name: Клиент на macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Установить ninja
        uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Зависимости Vulkan
        run: |
          brew install --quiet vulkan-headers vulkan-loader molten-vk glslang || true
      - name: Собрать клиент
        run: |
          cmake -S . -B build/client -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPW_BUILD_CLIENT=ON -DPW_BUILD_TESTS=ON
          cmake --build build/client -j3
      - name: Проверки сборки карты
        run: ./build/client/bin/pw_render_view_tests

  # ---------------------------------------------------------------------------
  # Детерминизм. Каждая платформа сверяется с эталоном, зафиксированным
  # в determinism_main.cpp. Расхождение хотя бы в одном разряде означает, что
  # симуляция разъехалась между x86 и ARM — красный билд, а не предупреждение.
  # ---------------------------------------------------------------------------
  determinism:
    name: Детерминизм ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "x86-64",       os: ubuntu-latest, extra: "" }
          - { name: "arm64",        os: macos-latest,  extra: "" }
          # Программный путь 128-битной арифметики — тот, по которому пойдёт
          # MSVC. Он обязан давать тот же результат, что и аппаратный __int128.
          - { name: "soft-int128",  os: ubuntu-latest, extra: "-U__SIZEOF_INT128__" }
    steps:
      - uses: actions/checkout@v4
      - name: Сборка проверки
        run: |
          c++ -std=c++20 -O2 -ffp-contract=off -fno-fast-math ${{ matrix.extra }} \
              -Iengine/core/include \
              engine/core/tests/determinism_main.cpp \
              engine/core/src/log.cpp engine/core/src/jobs.cpp \
              -o pw_determinism_check -pthread
      - name: Сверка с эталоном
        run: ./pw_determinism_check

  # ---------------------------------------------------------------------------
  # Сгенерированные файлы обязаны совпадать со своим генератором.
  # Правка trig_tables.inc руками молча изменила бы всю математику игры.
  # ---------------------------------------------------------------------------
  generated:
    name: Сгенерированные файлы актуальны
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Перегенерировать таблицы
        run: python3 tools/gen_trig_tables.py
      - name: Проверить отсутствие расхождений
        run: |
          if ! git diff --exit-code -- engine/core/include/pw/core/trig_tables.inc; then
            echo "::error::trig_tables.inc не совпадает с выводом tools/gen_trig_tables.py"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Графика. Клиент собирается с SDL3 и Vulkan, а кадр проверяется автотестом
  # на ПРОГРАММНОМ растеризаторе — видеокарты на раннере нет и не будет.
  # Без этой работы рендер проверялся бы только глазами и только тогда, когда
  # кто-то удосужился посмотреть.
  # ---------------------------------------------------------------------------
  render:
    name: Рендер (программный Vulkan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Установить ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Зависимости SDL3 и Vulkan
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libvulkan-dev vulkan-validationlayers mesa-vulkan-drivers glslang-tools \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxfixes-dev libxss-dev libxtst-dev libxinerama-dev libxkbcommon-dev \
            libwayland-dev libdrm-dev libgbm-dev libudev-dev libasound2-dev \
            libpulse-dev libdbus-1-dev libibus-1.0-dev libdecor-0-dev

      # Ассеты печь не нужно: испечённые атласы и шрифт лежат
      # в репозитории. Что они не разошлись с моделями, проверяет
      # отдельная работа «Ассеты из Blender».
      - name: Сборка клиента
        run: |
          cmake -S . -B build/render -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DPW_BUILD_CLIENT=ON -DPW_BUILD_TESTS=ON
          cmake --build build/render -j"$(nproc)"

      - name: Автопроверка кадра
        run: ./build/render/bin/pw_render_tests

      - name: Проверки сборки карты
        run: ./build/render/bin/pw_render_view_tests
      - name: "Живая игра: сервер, клиент, карта в PNG"
        run: |
          ./build/render/bin/pw_server --port 27099 --systems 120 --report 0 &
          SERVER=$!
          sleep 1
          ./build/render/bin/pw_game_client --port 27099 --name ci \
            --shot galaxy_map.png --shot-after 4 --width 1280 --height 720
          kill $SERVER

      # Вид системы проверяется ОТДЕЛЬНЫМ снимком, а не заодно с картой.
      # Это другой конвейер целиком: буфер глубины, сетки, свет, свечение.
      # Карта галактики зелёная не говорит о нём ничего.
      - name: "Живая игра: вид системы в PNG"
        run: |
          ./build/render/bin/pw_server --port 27098 --systems 80 --report 0 &
          SERVER=$!
          sleep 1
          ./build/render/bin/pw_game_client --port 27098 --name ci \
            --shot system_view.png --shot-system --shot-after 4 \
            --width 1280 --height 720
          kill $SERVER

      - name: Отрисовать кадр в файл
        run: ./build/render/bin/pw_triangle --out triangle.png --size 640 360 --validation

      - name: Выгрузить кадры
        uses: actions/upload-artifact@v4
        with:
          name: frames
          path: |
            triangle.png
            galaxy_map.png
            system_view.png
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Прогон сезона. Час игры на четырёх ботах со всеми подсистемами сразу.
  #
  # Этот шаг существует потому, что юнит-тесты ловят логику, а замысел ловит
  # только совместная работа частей. Четыре дефекта подряд — корабли летели
  # хвостом вперёд, у галактики было пустое ядро, флоты пересекали её за
  # полторы минуты, планетам не выдавали застройку — нашёл прогон, а не тесты.
  # Пятым стала модель потерь: флот терял единственный крейсер от трёх
  # процентов урона, и все 124 теста при этом проходили.
  #
  # --check проверяет инварианты каждый тик и возвращает 1 при нарушении.
  # ---------------------------------------------------------------------------
  season:
    name: Прогон сезона
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Собрать
        run: |
          cmake --preset linux-x64-release
          cmake --build build/linux-x64-release --target pw_season pw_sim_tests -j
      - name: Тесты симуляции
        run: ./build/linux-x64-release/bin/pw_sim_tests
      # Галактика маленькая, а часов больше, чем в игре по умолчанию,
      # и это осознанно: прогон обязан ДОВЕСТИ БОТОВ ДО ВСТРЕЧИ. С захватом
      # по планетам расселение стало вчетверо медленнее, и на двухстах
      # системах за час боты не видят друг друга — вся военная часть игры
      # остаётся непроверенной, а прогон при этом зелёный.
      - name: Три часа игры с проверкой инвариантов
        run: ./build/linux-x64-release/bin/pw_season --systems 60 --hours 3 --check
      - name: Прогон воспроизводим бит в бит
        run: |
          A=$(./build/linux-x64-release/bin/pw_season --hours 1 | grep "хеш мира")
          B=$(./build/linux-x64-release/bin/pw_season --hours 1 | grep "хеш мира")
          echo "1: $A"
          echo "2: $B"
          if [ "$A" != "$B" ]; then
            echo "::error::два одинаковых прогона дали разный хеш мира"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Слои архитектуры. Правила вроде «pw_sim зависит только от pw_core»
  # дисциплиной не удержать: однажды кто-то добавит #include, и через полгода
  # сервер перестанет собираться без видеокарты.
  # ---------------------------------------------------------------------------
  layering:
    name: Слои архитектуры
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: ./tools/check_layering.sh

  # ---------------------------------------------------------------------------
  # Шейдеры обязаны совпадать со своим исходником — как и таблицы
  # тригонометрии. Правка SPIR-V руками молча изменила бы картинку.
  # ---------------------------------------------------------------------------
  shaders:
    name: SPIR-V актуален
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq glslang-tools
      - run: ./tools/compile_shaders.sh
      - name: Проверить отсутствие расхождений
        run: |
          if ! git diff --exit-code -- engine/rhi/shaders/spirv engine/rhi/include/pw/rhi/shaders.inc; then
            echo "::error::скомпилированные шейдеры не совпадают с исходниками"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Ассетный пайплайн: Blender строит модели и печёт спрайтовые атласы.
  # Запускается headless через модуль bpy — GPU не нужен.
  # ---------------------------------------------------------------------------
  assets:
    name: Ассеты из Blender
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Установить Blender (модуль bpy)
        run: python3 -m pip install bpy
      - name: Собрать атласы
        run: python3 tools/blender/build_assets.py --quality ci
      # Ассеты закоммичены, но источник истины — модели. Если кто-то
      # правит корпус и забывает перепечь, игра поедет со старой графикой,
      # и заметить это будет неоткуда.
      #
      # Сверяем РАСКЛАДКУ, а не пиксели: Cycles не обязан давать байт
      # в байт одинаковую картинку между версиями, и побайтовое сравнение
      # было бы ломким тестом. А вот число кадров, их имена и размер
      # атласа обязаны совпадать — это и ловит забытую перепечку.
      - name: Раскладка совпадает с закоммиченной
        run: |
          python3 - <<'PYEOF'
          import json, subprocess, sys

          def layout(text):
              data = json.loads(text)
              return {
                  "atlas_size": data["atlas_size"],
                  "rotation_steps": data["rotation_steps"],
                  "frames": sorted((f["hull"], f["rotation"], f["w"], f["h"])
                                   for f in data["frames"]),
              }

          fresh = layout(open("assets/build/ships.json", encoding="utf-8").read())
          committed = layout(subprocess.run(
              ["git", "show", "HEAD:assets/build/ships.json"],
              capture_output=True, text=True, check=True).stdout)

          if fresh == committed:
              print("раскладка совпадает: кадров", len(fresh["frames"]))
          else:
              print("::error::закоммиченные ассеты разошлись с моделями —"
                    " перепеките: tools/blender/build_assets.py --quality ci")
              sys.exit(1)

          # Планеты: сверяем СОСТАВ манифеста. Класс планеты — это индекс
          # в списке, и движок адресует им и сетку, и текстуру. Разойдись
          # порядок — океанический мир получит поверхность выжженного
          # камня, и заметить это можно будет только глазами.
          def planets(text):
              data = json.loads(text)
              return {
                  "planets": [(p["class"], p["id"], p["mesh"], p["texture"])
                              for p in data["planets"]],
                  "stars": [(s["class"], s["id"]) for s in data.get("stars", [])],
                  "structures": [(b["building"], b["id"])
                                 for b in data.get("structures", [])],
                  "hulls": [(h["hull"], h["id"]) for h in data.get("hulls", [])],
              }

          fresh = planets(open("assets/build/planets.json", encoding="utf-8").read())
          committed = planets(subprocess.run(
              ["git", "show", "HEAD:assets/build/planets.json"],
              capture_output=True, text=True, check=True).stdout)

          if fresh != committed:
              print("::error::манифест планет разошёлся с моделями —"
                    " перепеките: tools/blender/build_assets.py --quality ci")
              for key in sorted(set(fresh) | set(committed)):
                  a, b = fresh.get(key, []), committed.get(key, [])
                  for item in [x for x in a if x not in b]:
                      print(f"  {key}: только после перепечки:", item)
                  for item in [x for x in b if x not in a]:
                      print(f"  {key}: только в репозитории:  ", item)
              sys.exit(1)

          print("планеты совпадают:", len(fresh["planets"]), "классов,",
                len(fresh["structures"]), "построек,",
                len(fresh["hulls"]), "корпусов")

          # Интерфейс: сверяем ИМЕНА спрайтов и поля растяжки. Имя — это
          # то, чем движок просит спрайт; переименовали в Blender — кнопка
          # тихо теряет подложку, и замечает это игрок, а не сборка.
          def ui(text):
              data = json.loads(text)
              return sorted((s["name"], s["w"], s["h"], s.get("border", 0))
                            for s in data["sprites"])

          fresh_ui = ui(open("assets/build/ui.json", encoding="utf-8").read())
          committed_ui = ui(subprocess.run(
              ["git", "show", "HEAD:assets/build/ui.json"],
              capture_output=True, text=True, check=True).stdout)

          if fresh_ui != committed_ui:
              print("::error::атлас интерфейса разошёлся с моделями —"
                    " перепеките: tools/blender/build_assets.py --quality ci")
              for item in [x for x in fresh_ui if x not in committed_ui]:
                  print("  только после перепечки:", item)
              for item in [x for x in committed_ui if x not in fresh_ui]:
                  print("  только в репозитории:  ", item)
              sys.exit(1)

          print("интерфейс совпадает:", len(fresh_ui), "спрайтов")
          sys.exit(0)
          PYEOF

      - name: Выгрузить атласы
        uses: actions/upload-artifact@v4
        with:
          name: sprite-atlases
          path: assets/build/
          retention-days: 7
